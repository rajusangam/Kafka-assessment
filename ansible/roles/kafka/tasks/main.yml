---
- name: Ensure kafka client tooling directory exists
  ansible.builtin.file:
    path: /opt/kafka-tools
    state: directory
    mode: "0755"

- name: Deploy client configuration
  ansible.builtin.template:
    src: client.properties.j2
    dest: /opt/kafka-tools/client.properties
    mode: "0640"
  notify: restart kafka clients
